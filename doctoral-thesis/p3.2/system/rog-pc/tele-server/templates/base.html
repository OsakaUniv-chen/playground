<!doctype html>
<title>TeleOp {{ robot_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" type="image/png" href="/static/favicon/BLR-ロゴ-ど.png">

{% if not ros_enabled %}
<!-- 指令が出ない状態で「動かない」と現地で悩まないよう、画面に出しておく。 -->
<div class="banner">UI_ROS_ENABLE=0 —— 画面だけ。操作指令は出ません</div>
{% endif %}

<section class="content">
    <!-- 映像は rgb_sm 一本（stream-server が魚眼＋音響マップを合成済み）。
         音声は onboardmic を別に引く ── rgb_sm は合成のため一周多く回るので、
         音までそれに乗せると会話が数百 ms 遅れる。 -->
    <div class="player-wrapper">
        <div id="player-view"></div>
    </div>

    <div class="status-indicator">
        <div>SPEED: <span id="speed">0</span></div>
        <div>ROTATE: <span id="rotate">0</span></div>
    </div>
    <div id="indicator" class="text-indicators"></div>

    <div class="overlay" id="overlay_infoimage_topleft">Navigate with <br>
        <img border="0" src="{{ url_for('static', filename='icons8/iconscoutL.png') }}" width="60" height="60">
    </div>

    <!-- 右スティックは空き。頭部は vlm-server の VLM が動かす（設計 §5）。
         自律を上書きする手動介入に割り当てるかは未決。 -->

    <!-- 割り当てのあるボタンだけ出す。マイクは常時オンなので PTT は無い。 -->
    <div class="overlay" id="overlay_buttons_abxy">
        <div class="controller-buttons">
            <div class="btn y" id="btnY"><span>Arm Up</span></div>
            <div class="btn x" id="btnX"><span>Arm Down</span></div>
        </div>
    </div>
</section>

<!-- CDN は使わない。現地にインターネットが無いと画面ごと落ちるため
     vendor/ に置いたものを読む（README の「vendor 化」参照）。 -->
<script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/ovenplayer.js') }}"></script>
<script src="{{ url_for('static', filename='js/websocket.js') }}"></script>
<script src="{{ url_for('static', filename='js/gamepad.js') }}"></script>
<script>
    // **OME は別の機械**（rog-server）。旧実装ではブラウザと OME が同一機
    // だったので localhost だったが、架構 §4 で tele-server と tele-pc に
    // 分かれたので、ここは rog-server の名前を指す（OME_HOST_BROWSER）。
    // ページが http なので ws（平文）。WebRTC のメディア自体は DTLS/SRTP。
    // 接続先と stream key は tele-server/config.env の値を app.py が流し込む
    // （ここに直書きすると送出側の robot-pc と食い違う）。
    const OME = "{{ ome_ws }}";
    const mkPlayer = (id, key, mute) => OvenPlayer.create(id, {
        autoStart: true, autoFallback: true, mute: mute, controls: false,
        sources: [{ type: "webrtc", file: OME + key }],
        parseStream: { enabled: true }
    });

    // 映像（合成済み・音声なし）
    const playerView = mkPlayer("player-view", "{{ stream_view }}", true);

    // 音声だけの別ストリーム。**画面には出さない**ので隠しコンテナに作る。
    // mute:false ── これが機体マイクの音。
    const audioBox = document.createElement("div");
    audioBox.id = "player-onboardmic";
    audioBox.style.display = "none";
    document.body.appendChild(audioBox);
    const playerMic = mkPlayer("player-onboardmic", "{{ stream_onboardmic }}", false);
</script>
